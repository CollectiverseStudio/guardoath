name: Trusted Reference Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "guardoath/advanced_trusted_reference.py"
      - "guardoath/trusted_reference.py"
      - "guardoath/json_data.py"
      - "guardoath/models.py"
      - "guardoath/tenant_record.py"
      - "guardoath/business.py"
      - "guardoath/engine.py"
      - "guardoath/record_rules.py"
      - "tools/sign_trusted_reference.py"
      - "tests/test_advanced_trusted_reference.py"
      - "tests/test_trusted_reference_value_validity.py"
      - "tests/test_trusted_reference_signing_cli.py"
      - "tests/test_field_comparison_reference_isolation.py"
      - "tests/test_trusted_reference_interval_bounds.py"
      - "tests/test_signed_reference_tenant_replay.py"
      - "guardoath/advanced_conversion_time.py"
      - "tests/test_field_comparison_timestamp_offsets.py"
      - "tests/test_fx_reference_timestamp_admission.py"
      - ".github/workflows/field-reference-acceptance.yml"
permissions:
  contents: read
jobs:
  signed-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[test,pii]'
      - name: Host-signed reference and authenticated tenant API
        run: >-
          python -m pytest -q
          tests/test_advanced_trusted_reference.py
          tests/test_trusted_reference_value_validity.py
          tests/test_trusted_reference_signing_cli.py
          tests/test_field_comparison_reference_isolation.py
          tests/test_trusted_reference_interval_bounds.py
          tests/test_signed_reference_tenant_replay.py
          tests/test_field_comparison_timestamp_offsets.py
          tests/test_fx_reference_timestamp_admission.py
          tests/test_advanced_arithmetic.py
          tests/test_advanced_identity.py
          tests/test_advanced_conversion_time.py
