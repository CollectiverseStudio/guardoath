name: Trusted Reference Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "guardoath/advanced_trusted_reference.py"
      - "guardoath/trusted_reference.py"
      - "guardoath/models.py"
      - "guardoath/tenant_record.py"
      - "guardoath/business.py"
      - "guardoath/engine.py"
      - "guardoath/record_rules.py"
      - "tools/sign_trusted_reference.py"
      - "tests/test_advanced_trusted_reference.py"
      - ".github/workflows/field-reference-acceptance.yml"
permissions:
  contents: read
jobs:
  signed-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[test,pii]'
      - name: Host-signed reference and authenticated tenant API
        run: python -m pytest -q tests/test_advanced_trusted_reference.py tests/test_advanced_arithmetic.py tests/test_advanced_identity.py tests/test_advanced_conversion_time.py
