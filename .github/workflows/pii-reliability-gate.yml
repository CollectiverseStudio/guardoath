name: PII Reliability Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "guardoath/pii.py"
      - "guardoath/privacy_digit_prefilter.py"
      - "tests/test_privacy_digit_prefilter.py"
      - "tests/test_pii.py"
      - "guardoath/privacy_patterns/url_recognizer.py"
      - "guardoath/privacy_patterns/pattern_recognizer.py"
      - "tests/privacy_patterns/test_url_recognizer.py"
      - "guardoath/engine.py"
      - "guardoath/checkers.py"
      - "guardoath/secrets_check.py"
      - "guardoath/encoded_pii.py"
      - "guardoath/text_security.py"
      - "guardoath/privacy_catalog.py"
      - "guardoath/sensitive_fields.py"
      - "guardoath/privacy_patterns/**"
      - "policies/playground.json"
      - "tests/test_dashboard.py"
      - "tools/pii_reliability_probe.py"
      - "tools/pii_release_matrix.py"
      - "tools/conversation_privacy_release.py"
      - "tools/conversation_privacy_contention.py"
      - "tests/test_conversation_privacy_contention.py"
      - "tests/test_conversation_privacy_release.py"
      - "tests/test_privacy_workflow_trigger_contract.py"
      - "tools/pii_latency_probe.py"
      - "tests/test_pii_latency_probe.py"
      - "tests/test_pii_regex_concurrency.py"
      - "tests/test_pii_release_matrix.py"
      - ".github/workflows/pii-reliability-gate.yml"

permissions:
  contents: read

jobs:
  real-pii-tail:
    name: real-pii-tail (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install existing local recognizers and tests
        run: python -m pip install -e '.[test,pii]'
      - name: Verify regex concurrency never changes detector matches
        run: python -m pytest -q tests/test_privacy_digit_prefilter.py tests/test_pii.py tests/test_pii_regex_concurrency.py tests/test_pii_reliability_probe.py tests/test_pii_release_matrix.py tests/test_conversation_privacy_release.py tests/test_conversation_privacy_contention.py tests/test_privacy_workflow_trigger_contract.py tests/test_pii_latency_probe.py tests/privacy_patterns/test_url_recognizer.py
      - name: Repeated real PII detection and mandatory redaction recheck (20 rounds)
        run: python -m tools.pii_reliability_probe --rounds 20
      - name: Repeated previously failed phone/Korean RRN/DOB/redaction cases (20 rounds)
        run: python -m tools.pii_release_matrix --rounds 20
      - name: Repeated shipped conversation four-check profile on Input and Output (20 rounds)
        run: python -m tools.conversation_privacy_release --rounds 20
      - name: Concurrent shipped conversation profile with bounded local contention (10 rounds, 4 workers)
        run: python -m tools.conversation_privacy_contention --rounds 10 --concurrency 4
      - name: Bounded first-pass and redaction-recheck latency diagnostics (10 rounds, 4 concurrent)
        run: python -m tools.pii_latency_probe --rounds 10 --concurrency 4
