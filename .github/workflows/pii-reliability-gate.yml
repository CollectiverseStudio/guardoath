name: PII Reliability Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "guardoath/pii.py"
      - "guardoath/engine.py"
      - "tools/pii_reliability_probe.py"
      - "tools/pii_release_matrix.py"
      - "tests/test_pii_regex_concurrency.py"
      - "tests/test_pii_release_matrix.py"
      - ".github/workflows/pii-reliability-gate.yml"

permissions:
  contents: read

jobs:
  real-pii-tail:
    name: real-pii-tail (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install existing local recognizers and tests
        run: python -m pip install -e '.[test,pii]'
      - name: Verify regex concurrency never changes detector matches
        run: python -m pytest -q tests/test_pii_regex_concurrency.py tests/test_pii_reliability_probe.py tests/test_pii_release_matrix.py
      - name: Repeated real PII detection and mandatory redaction recheck (20 rounds)
        run: python -m tools.pii_reliability_probe --rounds 20
      - name: Repeated previously failed phone/Korean RRN/DOB/redaction cases (20 rounds)
        run: python -m tools.pii_release_matrix --rounds 20
