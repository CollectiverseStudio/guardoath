name: Full Rule Mutation Audit
on:
  workflow_dispatch:
    inputs:
      variants:
        description: 'Variants per original example and benign lookalike (1-128)'
        type: number
        required: true
        default: 8
  push:
    branches: [main]
    paths:
      - "tools/rule_mutation_audit.py"
      - "tests/test_rule_mutation_audit.py"
      - ".github/workflows/full-rule-mutation-audit.yml"
permissions:
  contents: read
jobs:
  all-static-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test,pii]'
      - name: Exercise generator and private real-checker evidence
        run: python -m pytest -q tests/test_rule_mutation_audit.py
      - name: Evaluate every catalog rule on Input and Output
        shell: bash
        run: |
          VARIANTS="${{ inputs.variants || 8 }}"
          if ! [[ "$VARIANTS" =~ ^[0-9]+$ ]] || (( VARIANTS < 1 || VARIANTS > 128 )); then
            echo 'Invalid variant count' >&2
            exit 1
          fi
          mkdir -p .guardoath-reports
          python -m tools.rule_mutation_audit --variants "$VARIANTS" --output .guardoath-reports/rule-drift.json
      - name: Upload private-safe rule ID drift matrix
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rule-drift-${{ github.sha }}
          path: .guardoath-reports/rule-drift.json
          if-no-files-found: warn
          retention-days: 30
