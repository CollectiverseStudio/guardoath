name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - name: Secrets group - 100 expectations
        run: python -m valinator.evaluate --cases evals/secrets.json --policies policies/secrets-batch.json
  local-pii:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[test,pii]'
      - run: pytest -q
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 'lts/*'
          cache: npm
      - run: python -m pip install -e '.[test,pii]'
      - run: npm ci
      - run: npm run test:browser
        env:
          PLAYWRIGHT_CHANNEL: chrome

  windows-launcher:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test,pii]"
      - run: python -m pytest tests/test_launcher.py -q
