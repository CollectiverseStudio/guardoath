name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
# Each main push otherwise leaves another 13-job test matrix running, often
# including overlapping Chrome/Playwright launches. Only the newest main SHA
# can be released; cancel superseded *push* runs to conserve CI capacity.
# Pull-request and manual run groups include their SHA so they retain their
# own full individual job receipts and are not preempted by a main push.
concurrency:
  group: guardoath-tests-${{ github.ref }}-${{ github.event_name == 'push' && 'latest-main-push' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test,pii]'
      - run: pytest -q
      - name: Secrets group - 100 expectations
        run: python -m guardoath.evaluate --cases evals/secrets.json --policies policies/secrets-batch.json
      - name: Structure group - 100 expectations
        run: python -m guardoath.evaluate --cases evals/structure.json --policies policies/structure-batch.json
      - name: Business group - 100 expectations
        run: python -m guardoath.evaluate --cases evals/business.json --policies policies/business-batch.json
      - name: Local text security - 100 expectations
        run: python -m guardoath.evaluate --cases evals/text-security.json --policies policies/text-security-batch.json
      - name: Matched-outcome bias checks - 100 expectations
        run: python -m guardoath.evaluate --cases evals/bias.json --policies policies/bias-batch.json
      - name: Citation evidence checks - 100 expectations
        run: python -m guardoath.evaluate --cases evals/evidence.json --policies policies/evidence-batch.json
      - name: Proposed tool-call checks - 100 expectations
        run: python -m guardoath.evaluate --cases evals/actions.json --policies policies/actions-batch.json
      - name: Ledger checks - 100 expectations
        run: python -m guardoath.evaluate --cases evals/ledger.json --policies policies/ledger-batch.json
      - name: Timestamps checks - 100 expectations
        run: python -m guardoath.evaluate --cases evals/timestamps.json --policies policies/timestamps-batch.json
      - name: Graph checks - 100 expectations
        run: python -m guardoath.evaluate --cases evals/graph.json --policies policies/graph-batch.json
      - name: Integrity checks - 100 expectations
        run: python -m guardoath.evaluate --cases evals/integrity.json --policies policies/integrity-batch.json
  local-pii:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[test,pii]'
      - run: pytest -q
      - name: Privacy group - 100 expectations
        run: python -m guardoath.evaluate --pii --cases evals/privacy.json --policies policies/privacy-batch.json
      - name: Encoded sensitive data - 100 expectations
        run: python -m guardoath.evaluate --pii --cases evals/encoded-privacy.json --policies policies/encoded-privacy-batch.json
      - name: Privacy pattern checks - 100 expectations
        run: python -m guardoath.evaluate --pii --cases evals/privacy-patterns.json --policies policies/privacy-patterns-batch.json
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 'lts/*'
          cache: npm
      - run: python -m pip install -e '.[test,pii]'
      - run: npm ci
      - run: npm run test:browser
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - name: Retain exact browser failure context without customer secrets
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: dashboard-browser-failure-${{ github.sha }}
          path: test-results/**/error-context.md
          if-no-files-found: warn
          retention-days: 7

  windows-launcher:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test,pii]"
      - name: Full test suite on Windows (includes the launcher tests)
        run: python -m pytest -q

  optional-aws-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test,pii,aws]'
      - name: DynamoDB tenant store (boto3)
        run: python -m pytest tests/test_dynamodb_store.py -q

  release-wheel:
    # The other jobs install the checkout in editable mode, which cannot show whether the built wheel ships its
    # data files. This job builds the real wheel, checks its Sigma assets against the checkout, then installs it
    # (not editable, no network) and runs the installed-package acceptance outside the checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Build the repository wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Sigma assets in the wheel match the checkout
        run: |
          python -m guardoath.sigma_rules.verify_distribution dist/guardoath-*.whl > "$RUNNER_TEMP/distribution.json"
          python - "$RUNNER_TEMP/distribution.json" <<'EOF'
          import json, pathlib, sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          rules = len(list(pathlib.Path("guardoath/sigma_rules/upstream").glob("batch_*/*.yml")))
          manifests = len(list(pathlib.Path("guardoath/sigma_rules").glob("upstream_batch_*.json")))
          expected = (rules, rules, rules + manifests + 1)
          actual = (report["rule_count"], report["pinned_rule_count"], report["required_asset_count"])
          print("rules, pinned, required assets:", actual, "expected:", expected)
          assert actual == expected
          EOF
      - name: Installed wheel passes the Sigma acceptance outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/python" -m pip install --no-index --no-deps dist/guardoath-*.whl
          root=$("$RUNNER_TEMP/installed/bin/python" -I -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          rules=$(ls guardoath/sigma_rules/upstream/batch_*/*.yml | wc -l)
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/installed/bin/python" -I -m guardoath.sigma_rules.verify_installation --expected-root "$root" > acceptance.json
          "$RUNNER_TEMP/installed/bin/python" -I -c "import json, sys; r = json.load(open('acceptance.json')); print(r); n = int(sys.argv[1]); assert (r['rule_count'], r['pinned_rule_count'], r['positive_cases'], r['benign_cases'], r['missing_event_cases'], r['malformed_event_rejections'], r['routing_previews']) == (n,) * 7" "$rules"

