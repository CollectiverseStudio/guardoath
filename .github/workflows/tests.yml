name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - name: Secrets group - 100 expectations
        run: python -m valinator.evaluate --cases evals/secrets.json --policies policies/secrets-batch.json
      - name: Structure group - 100 expectations
        run: python -m valinator.evaluate --cases evals/structure.json --policies policies/structure-batch.json
      - name: Business group - 100 expectations
        run: python -m valinator.evaluate --cases evals/business.json --policies policies/business-batch.json
      - name: Local text security - 100 expectations
        run: python -m valinator.evaluate --cases evals/text-security.json --policies policies/text-security-batch.json
      - name: Matched-outcome bias checks - 100 expectations
        run: python -m valinator.evaluate --cases evals/bias.json --policies policies/bias-batch.json
      - name: Citation evidence checks - 100 expectations
        run: python -m valinator.evaluate --cases evals/evidence.json --policies policies/evidence-batch.json
      - name: Proposed tool-call checks - 100 expectations
        run: python -m valinator.evaluate --cases evals/actions.json --policies policies/actions-batch.json
  local-pii:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[test,pii]'
      - run: pytest -q
      - name: Privacy group - 100 expectations
        run: python -m valinator.evaluate --pii --cases evals/privacy.json --policies policies/privacy-batch.json
      - name: Encoded sensitive data - 100 expectations
        run: python -m valinator.evaluate --pii --cases evals/encoded-privacy.json --policies policies/encoded-privacy-batch.json
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 'lts/*'
          cache: npm
      - run: python -m pip install -e '.[test,pii]'
      - run: npm ci
      - run: npm run test:browser
        env:
          PLAYWRIGHT_CHANNEL: chrome

  windows-launcher:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test,pii]"
      - run: python -m pytest tests/test_launcher.py -q

  optional-aws-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test,pii,aws]'
      - name: Content safety - 100 offline contract cases plus integration tests
        run: python -m pytest tests/test_content_safety.py tests/test_bedrock_guardrails.py -q

