name: Field Comparisons Evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "guardoath/business.py"
      - "guardoath/models.py"
      - "guardoath/record_rules.py"
      - "guardoath/engine.py"
      - "guardoath/tenant_record.py"
      - "tools/field_comparison_portfolio.py"
      - "tools/field_comparison_scale.py"
      - "docs/field-comparisons-rule-inventory.json"
      - "tests/test_field_comparison_scale_exit.py"
      - ".github/workflows/field-comparison-evidence.yml"

permissions:
  contents: read

jobs:
  strict-portfolio-and-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Install existing local validation dependencies
        run: python -m pip install -e '.[test,pii]'
      - name: Strict current-source portfolio (feasible and impossible cases)
        id: portfolio
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts/field-comparisons
          python -m tools.field_comparison_portfolio --output artifacts/field-comparisons/portfolio.json
      - name: Bounded current-source 30/51/100/250/500 scale
        id: scale
        continue-on-error: true
        shell: bash
        run: |
          python -m tools.field_comparison_scale --samples 3 --timeout 10 --output artifacts/field-comparisons/scale.json
      - name: Record provenance and per-step gate results
        if: always()
        shell: bash
        env:
          PORTFOLIO_RESULT: ${{ steps.portfolio.outcome }}
          SCALE_RESULT: ${{ steps.scale.outcome }}
        run: |
          mkdir -p artifacts/field-comparisons
          printf '%s\n' "$GITHUB_SHA" > artifacts/field-comparisons/source-commit.txt
          printf 'portfolio=%s\nscale=%s\n' "$PORTFOLIO_RESULT" "$SCALE_RESULT" > artifacts/field-comparisons/gate-status.txt
          cat artifacts/field-comparisons/gate-status.txt
      - name: Preserve fresh synthetic reports even when acceptance fails
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: field-comparisons-${{ github.sha }}
          path: artifacts/field-comparisons/
          if-no-files-found: error
          retention-days: 14
      - name: Enforce truthful portfolio and scale acceptance
        if: always()
        shell: bash
        env:
          PORTFOLIO_RESULT: ${{ steps.portfolio.outcome }}
          SCALE_RESULT: ${{ steps.scale.outcome }}
        run: |
          if [ "$PORTFOLIO_RESULT" != "success" ] || [ "$SCALE_RESULT" != "success" ]; then
            echo "::error::Field Comparison acceptance failed on exact source SHA $GITHUB_SHA (portfolio=$PORTFOLIO_RESULT, scale=$SCALE_RESULT). Review attached synthetic reports; do not release."
            exit 1
          fi
