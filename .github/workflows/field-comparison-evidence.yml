name: Field Comparisons Evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "guardoath/business.py"
      - "guardoath/models.py"
      - "guardoath/record_rules.py"
      # FC-031–050 use the same tenant Engine but live in advanced-family modules.
      # Their source and customer regression edits must re-run strict original
      # FC-001–030 witnesses plus 30/51/100/250/500 mixed-family evidence.
      - "guardoath/advanced_*.py"
      - "tests/test_fc*.py"
      - "tests/browser/fc*.spec.js"
      # Also gate customer workflows named field_comparison_* and
      # advanced_field_comparison_* (real tenant/browser coverage).
      - "tests/browser/*field_comparison*.spec.js"
      # Guided arithmetic, identity and conversion tenant customer journeys
      # are mandatory FC regression sources even if only a browser spec changes.
      - "tests/browser/*guided_example.spec.js"
      - "tests/browser/*editor.spec.js"
      - "tests/browser/protected_reference_editors.spec.js"
      - "tests/test_*field_comparison*.py"
      - "guardoath/engine.py"
      - "guardoath/tenant_record.py"
      - "tools/field_comparison_portfolio.py"
      - "tools/field_comparison_scale.py"
      - "guardoath/app.py"
      - "guardoath/hosted.py"
      - "guardoath/static/dashboard.js"
      - "guardoath/static/dashboard.html"
      - "guardoath/static/comparison_editor.js"
      - "guardoath/static/arithmetic_editor.js"
      - "guardoath/static/identity_editor.js"
      # Protected FC-048 subset and FC-040 serial boundaries are covered by
      # real Engine/tenant tests and a customer authenticated browser test.
      - "tests/test_advanced_identity.py"
      - "tests/test_field_comparison_reference_isolation.py"
      - "tests/browser/identity_editor.spec.js"
      - "guardoath/static/conversion_editor.js"
      # Signed FC-044/045/047/049 are part of the same cross_field Engine,
      # and customer host-reference status/action changes must not avoid scale gates.
      - "guardoath/trusted_reference.py"
      - "tools/sign_trusted_reference.py"
      - "tests/test_advanced_trusted_reference.py"
      - "tests/test_trusted_reference_value_validity.py"
      - "tests/test_trusted_reference_signing_cli.py"
      # Time-window/identity replay and tenant-scoped FX reference admission
      # are release-critical even when only their test contract changes.
      - "tests/test_trusted_reference_interval_bounds.py"
      - "tests/test_signed_reference_tenant_replay.py"
      - "tests/test_fx_reference_timestamp_admission.py"
      - "tests/browser/trusted_reference_end_to_end.spec.js"
      - "tests/browser/trusted_reference_status.spec.js"
      - "tests/browser/field_comparison_unsaved_examples.spec.js"
      - "tests/test_field_comparison_large_tenant_api.py"
      - "tests/test_field_comparison_mixed_family_scale.py"
      - "tests/browser/field_comparison_mixed_family_scale.spec.js"
      - "tests/browser/field_comparisons_500.spec.js"
      - "docs/field-comparisons-rule-inventory.json"
      - "tests/test_field_comparison_scale_exit.py"
      - ".github/workflows/field-comparison-evidence.yml"

permissions:
  contents: read

jobs:
  strict-portfolio-and-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Install existing local validation dependencies
        run: python -m pip install -e '.[test,pii]'
      - name: Strict current-source portfolio (feasible and impossible cases)
        id: portfolio
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts/field-comparisons
          python -m tools.field_comparison_portfolio --output artifacts/field-comparisons/portfolio.json
      - name: Bounded current-source 30/51/100/250/500 scale
        id: scale
        continue-on-error: true
        shell: bash
        run: |
          python -m tools.field_comparison_scale --samples 3 --timeout 10 --output artifacts/field-comparisons/scale.json
      - name: Authenticated ordinary and mixed four-family tenant API at 30/51/100/250/500
        id: tenant
        continue-on-error: true
        shell: bash
        run: |
          python -m pytest -q tests/test_field_comparison_large_tenant_api.py tests/test_field_comparison_mixed_family_scale.py --junitxml=artifacts/field-comparisons/tenant-api-junit.xml
      - name: Host-signed reference integrity, tenant isolation and signing CLI
        id: reference
        continue-on-error: true
        shell: bash
        run: |
          python -m pytest -q tests/test_advanced_trusted_reference.py tests/test_trusted_reference_value_validity.py tests/test_trusted_reference_signing_cli.py tests/test_field_comparison_reference_isolation.py tests/test_trusted_reference_interval_bounds.py tests/test_signed_reference_tenant_replay.py tests/test_fx_reference_timestamp_admission.py --junitxml=artifacts/field-comparisons/trusted-reference-junit.xml
      - name: Record provenance and per-step gate results
        if: always()
        shell: bash
        env:
          PORTFOLIO_RESULT: ${{ steps.portfolio.outcome }}
          SCALE_RESULT: ${{ steps.scale.outcome }}
          TENANT_RESULT: ${{ steps.tenant.outcome }}
          REFERENCE_RESULT: ${{ steps.reference.outcome }}
        run: |
          mkdir -p artifacts/field-comparisons
          printf '%s\n' "$GITHUB_SHA" > artifacts/field-comparisons/source-commit.txt
          printf 'portfolio=%s\nscale=%s\ntenant_api=%s\ntrusted_reference=%s\n' "$PORTFOLIO_RESULT" "$SCALE_RESULT" "$TENANT_RESULT" "$REFERENCE_RESULT" > artifacts/field-comparisons/gate-status.txt
          cat artifacts/field-comparisons/gate-status.txt
      - name: Preserve fresh synthetic reports even when acceptance fails
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: field-comparisons-${{ github.sha }}
          path: artifacts/field-comparisons/
          if-no-files-found: error
          retention-days: 14
      - name: Enforce truthful portfolio, scale and tenant API acceptance
        if: always()
        shell: bash
        env:
          PORTFOLIO_RESULT: ${{ steps.portfolio.outcome }}
          SCALE_RESULT: ${{ steps.scale.outcome }}
          TENANT_RESULT: ${{ steps.tenant.outcome }}
          REFERENCE_RESULT: ${{ steps.reference.outcome }}
        run: |
          if [ "$PORTFOLIO_RESULT" != "success" ] || [ "$SCALE_RESULT" != "success" ] || [ "$TENANT_RESULT" != "success" ] || [ "$REFERENCE_RESULT" != "success" ]; then
            echo "::error::Field Comparison acceptance failed on exact source SHA $GITHUB_SHA (portfolio=$PORTFOLIO_RESULT, scale=$SCALE_RESULT, tenant_api=$TENANT_RESULT, trusted_reference=$REFERENCE_RESULT). Review synthetic reports/JUnit; do not release."
            exit 1
          fi

  customer-browser-acceptance:
    # The strict deterministic portfolio is not customer-operable acceptance:
    # use the same real, authenticated demo tenant, Save checks, and shared
    # Engine that production customers exercise, including 500-rule UI cases.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 'lts/*'
          cache: npm
      - name: Install the shipped validation engine and local test dependencies
        run: python -m pip install -e '.[test,pii]'
      - name: Install pinned Playwright tests
        run: npm ci
      - name: Record exact browser acceptance source SHA
        run: |
          mkdir -p artifacts/field-comparisons
          printf '%s\n' "$GITHUB_SHA" > artifacts/field-comparisons/browser-source-commit.txt
      - name: Authenticated four-family, 500-rule, guided and protected-reference browser acceptance
        env:
          PLAYWRIGHT_CHANNEL: chrome
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: artifacts/field-comparisons/browser-junit.xml
        run: >-
          npx playwright test --reporter=line,junit
          tests/browser/field_comparison
          tests/browser/field_comparisons_500
          tests/browser/fc_comparison
          tests/browser/arithmetic
          tests/browser/identity
          tests/browser/conversion
          tests/browser/trusted_reference
          tests/browser/protected_reference_editors
      - name: Require real browser execution report
        if: always()
        shell: bash
        run: test -s artifacts/field-comparisons/browser-junit.xml
      - name: Retain synthetic browser results and exact SHA even on test failure
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: field-comparisons-browser-${{ github.sha }}
          path: |
            artifacts/field-comparisons/browser-source-commit.txt
            artifacts/field-comparisons/browser-junit.xml
          if-no-files-found: error
          retention-days: 14
