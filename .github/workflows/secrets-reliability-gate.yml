name: Secrets Reliability Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "guardoath/secrets_check.py"
      - "guardoath/engine.py"
      - "tools/secrets_reliability_gate.py"
      - "tests/test_secrets_reliability_gate.py"
      - "tests/test_secrets_catalog_reuse.py"
      - ".github/workflows/secrets-reliability-gate.yml"

permissions:
  contents: read

jobs:
  shipped-secrets-tail:
    name: shipped-secrets-tail (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install existing test dependencies
        run: python -m pip install -e '.[test,pii]'
      - name: Verify real Secrets cache tenant isolation and strict case contracts
        run: python -m pytest -q tests/test_secrets_catalog_reuse.py tests/test_secrets_reliability_gate.py tests/test_secrets_capacity.py
      - name: Repeat shipped Secrets cases under unchanged 500-ms policy (20 rounds)
        run: python -m tools.secrets_reliability_gate --rounds 20
