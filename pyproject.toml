[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "valinator"
version = "0.1.0"
description = "Policy-driven input and output checks for AI applications"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12", "pydantic==2.11.5", "uvicorn==0.34.2",
  "jsonschema==4.23.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==8.3.5"]

[tool.setuptools.packages.find]
include = ["valinator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
