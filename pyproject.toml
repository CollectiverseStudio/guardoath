[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "valinator"
version = "0.24.0"
description = "Policy-driven input and output checks for AI applications"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0", "pydantic==2.14.1", "uvicorn==0.54.0",
  "jsonschema==4.26.0", "starlette==1.10.0",
  "email-validator==2.3.0", "rfc3339-validator==0.1.4",
  "detect-secrets==1.5.0", "regex==2026.9.29",
]

[project.optional-dependencies]
aws = ["boto3==1.43.119", "botocore==1.43.121"]
azure = ["httpx2==2.16.0"]
test = ["httpx2==2.16.0", "pytest==9.2.0"]
pii = ["presidio-analyzer==2.2.366; python_version < '3.15'"]

[tool.setuptools.packages.find]
include = ["valinator*"]

[tool.setuptools.package-data]
valinator = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
